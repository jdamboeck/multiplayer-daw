[package]
name = "mdaw-test-plugin"
description = "A tiny deterministic CLAP instrument for testing the plugin host."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# A library for loading it in-process in tests, and a `.clap` file (rename the built library)
# for trying it in any host.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
clack-plugin = "0.2"
clack-extensions = { version = "0.2", features = ["clack-plugin", "audio-ports", "note-ports", "params", "state"] }
