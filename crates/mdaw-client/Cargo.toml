[package]
name = "mdaw-client"
description = "Desktop client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mdaw-model.workspace = true
mdaw-proto.workspace = true
mdaw-sync.workspace = true
mdaw-dsp.workspace = true
mdaw-engine.workspace = true
mdaw-net.workspace = true
mdaw-plugin.workspace = true
anyhow.workspace = true
getrandom.workspace = true
imbl.workspace = true
postcard.workspace = true
serde.workspace = true
quinn.workspace = true
tokio.workspace = true
eframe.workspace = true
egui.workspace = true
chrono.workspace = true
mdaw-tracktion = { workspace = true, optional = true }

[features]
# Plays through Tracktion Engine (crates/mdaw-tracktion), which builds native code with CMake and
# a C++ toolchain. Off by default, so that plain `cargo build` / `cargo test` and CI need neither;
# `cargo run -p mdaw-client --features tracktion` or `cargo xtask demo --tracktion` turn it on.
tracktion = ["dep:mdaw-tracktion"]

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu"] }
mdaw-server.workspace = true
mdaw-test-plugin = { path = "../mdaw-test-plugin" }
tempfile.workspace = true

[lib]
name = "mdaw_client"
path = "src/lib.rs"

[[bin]]
name = "mdaw"
path = "src/main.rs"

# Drives a session on Tracktion without a window, for the tests of the collaborative slice.
[[bin]]
name = "mdaw-slice"
path = "src/bin/mdaw-slice.rs"
required-features = ["tracktion"]

[[test]]
name = "slice"
required-features = ["tracktion"]

[[test]]
name = "ui_tracktion"
required-features = ["tracktion"]
