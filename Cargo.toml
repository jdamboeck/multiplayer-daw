[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Everything but the Tracktion bridge crates. The client depends on them, so plain `cargo build`
# builds their native part too (CMake, submodules, a C++ toolchain, ~10 minutes cold); their own
# tests run with `-p mdaw-tracktion` or `--workspace`. New crates must be added here too.
default-members = [
    "crates/mdaw-client",
    "crates/mdaw-model",
    "crates/mdaw-net",
    "crates/mdaw-proto",
    "crates/mdaw-server",
    "crates/mdaw-sync",
    "crates/mdaw-test-plugin",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
mdaw-model = { path = "crates/mdaw-model" }
mdaw-proto = { path = "crates/mdaw-proto" }
mdaw-sync = { path = "crates/mdaw-sync" }
mdaw-net = { path = "crates/mdaw-net" }
mdaw-server = { path = "crates/mdaw-server" }
mdaw-tracktion-sys = { path = "crates/mdaw-tracktion-sys" }
mdaw-tracktion = { path = "crates/mdaw-tracktion" }
imbl = { version = "7", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
postcard = { version = "1.1", features = ["use-std"] }
proptest = "1.12"
tempfile = "3"
eframe = "0.37"
egui = "0.37"
egui_kittest = "0.37"
blake3 = "1.8"
anyhow = "1"
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "net", "sync", "time", "macros", "signal"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
sha2 = "0.11"
getrandom = "0.4"
rusqlite = { version = "0.41", features = ["bundled"] }
midir = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
