[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
mdaw-model = { path = "crates/mdaw-model" }
mdaw-proto = { path = "crates/mdaw-proto" }
mdaw-sync = { path = "crates/mdaw-sync" }
mdaw-net = { path = "crates/mdaw-net" }
mdaw-server = { path = "crates/mdaw-server" }
mdaw-tracktion-sys = { path = "crates/mdaw-tracktion-sys" }
mdaw-tracktion = { path = "crates/mdaw-tracktion" }
mdaw-test-plugin = { path = "crates/mdaw-test-plugin" }
imbl = { version = "7", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
postcard = { version = "1.1", features = ["use-std"] }
proptest = "1.12"
tempfile = "3"
eframe = "0.37"
egui = "0.37"
egui_kittest = "0.37"
blake3 = "1.8"
anyhow = "1"
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "net", "sync", "time", "macros", "signal"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
sha2 = "0.11"
getrandom = "0.4"
rusqlite = { version = "0.41", features = ["bundled"] }
midir = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
# File and line in backtraces, no locals: full debug info of the dependencies (egui, wgpu,
# tokio, ...) made each client test binary hundreds of MB. Workspace crates keep full debug
# info. Tests inherit this profile.
debug = "line-tables-only"
