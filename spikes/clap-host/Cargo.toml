[package]
name = "spike-clap-host"
description = "Throwaway spike S1: host CLAP plugins from Rust with clack."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
clack-host = "0.2"
clack-extensions = { version = "0.2", features = [
    "clack-host",
    "audio-ports",
    "note-ports",
    "params",
    "state",
    "gui",
    "timer",
    "log",
    "thread-check",
    "render",
    "posix-fd",
] }
cpal = "0.18"
png = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pipewire"] }
x11rb = "0.14"
libc = "0.2"
